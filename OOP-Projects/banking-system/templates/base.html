<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏦 Banking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0d1117;
            color: #e6edf3;
        }

        .navbar {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .navbar-brand {
            color: #58a6ff !important;
            font-weight: bold;
        }

        .nav-link {
            color: #8b949e !important;
        }

        .nav-link:hover {
            color: #58a6ff !important;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
        }

        .card-header {
            background-color: #0d1117;
            border-bottom: 1px solid #30363d;
            color: #58a6ff;
        }

        .btn-primary {
            background-color: #238636;
            border-color: #238636;
        }

        .btn-primary:hover {
            background-color: #2ea043;
            border-color: #2ea043;
        }

        .btn-danger {
            background-color: #da3633;
            border-color: #da3633;
        }

        .btn-danger:hover {
            background-color: #f85149;
            border-color: #f85149;
        }

        .btn-warning {
            background-color: #d29922;
            border-color: #d29922;
            color: #0d1117;
        }

        .btn-warning:hover {
            background-color: #e3b341;
            border-color: #e3b341;
        }

        .form-control {
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: #e6edf3;
        }

        .form-control:focus {
            background-color: #0d1117;
            border-color: #58a6ff;
            color: #e6edf3;
        }

        .alert-success {
            background-color: #238636;
            border-color: #238636;
            color: #e6edf3;
        }

        .alert-danger {
            background-color: #da3633;
            border-color: #da3633;
            color: #e6edf3;
        }

        .table {
            color: #e6edf3;
        }

        .table-striped>tbody>tr:nth-of-type(odd) {
            background-color: #161b22;
        }

        .table-striped>tbody>tr:nth-of-type(even) {
            background-color: #0d1117;
        }

        .table th {
            border-bottom: 2px solid #30363d;
        }

        .text-muted {
            color: #8b949e !important;
        }

        a {
            color: #58a6ff;
            text-decoration: none;
        }

        a:hover {
            color: #79c0ff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">🏦 Banking System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('create_account') }}">➕ Create Account</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('deposit') }}">💰 Deposit</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('withdraw') }}">💳 Withdraw</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('transfer') }}">🔄 Transfer</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category if category == 'success' or category == 'error' else 'info' }} alert-dismissible fade show"
            role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
